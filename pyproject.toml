[project]
name = "pear-cluv"
version = "0.1.0"
description = "Mila control project for the existing DRAC PEAR deployments"
requires-python = ">=3.9"
dependencies = []

[tool.uv]
package = false
python-preference = "only-system"
python-downloads = "never"

[tool.cluv]
job_script_path = "scripts/job.sh"
results_path = "$SCRATCH/logs/pear-cluv"
results_symlink = "logs"
sbatch_args = { nodes = 8, ntasks-per-node = 1, gpus-per-node = "h100:4", time = "24:00:00", job-name = "pear-stage1", output = "logs/slurm-%j.out" }

[tool.cluv.env]
UV_OFFLINE = "1"
WANDB_MODE = "offline"
NUMA_HEADROOM_GB = "100"
ALLOW_TMPFS_LOCAL = "0"

# Disable this controller with `cluv disable mila` before racing.
[tool.cluv.clusters.mila]
project_dir = "$SCRATCH/pear-cluv"

[tool.cluv.clusters.tamia]
project_dir = "/scratch/s/sunyh/pear_cluv_control"
results_path = "/scratch/s/sunyh/pear_work/cluv_runs"
sbatch_args = { account = "aip-plbacon", partition = "gpubase_bynode_b3", cpus-per-task = 48, mem = "450G" }

[tool.cluv.clusters.tamia.env]
UV_CACHE_DIR = "/scratch/s/sunyh/pear_work/cache/cluv-uv"
PEAR_ROOT = "/scratch/s/sunyh/pear"
WORK_DIR = "/scratch/s/sunyh/pear_work"

[tool.cluv.clusters.fir]
project_dir = "/scratch/sunyh/pear_cluv_control"
results_path = "/scratch/sunyh/pear_work/cluv_runs"
# Temporary: CUDA initialization failed on this node in job 5132847; clear after recovery.
sbatch_args = { account = "rrg-bengioy-ad_gpu", partition = "gpubase_bynode_b3", cpus-per-task = 48, mem = "450G", exclude = "fc10609" }

[tool.cluv.clusters.fir.env]
UV_CACHE_DIR = "/scratch/sunyh/pear_work/cache/cluv-uv"
PEAR_ROOT = "/scratch/sunyh/pear"
WORK_DIR = "/scratch/sunyh/pear_work"

[tool.cluv.clusters.rorqual]
project_dir = "/scratch/sunyh/pear_cluv_control"
results_path = "/scratch/sunyh/pear_work/cluv_runs"
sbatch_args = { account = "rrg-bengioy-ad_gpu", partition = "gpubase_bynode_b3", cpus-per-task = 64, mem = "450G" }

[tool.cluv.clusters.rorqual.env]
UV_CACHE_DIR = "/scratch/sunyh/pear_work/cache/cluv-uv"
PEAR_ROOT = "/scratch/sunyh/pear"
WORK_DIR = "/scratch/sunyh/pear_work"
NUMA_HEADROOM_GB = "32"

# The alias reaches trig-login01 through the Trillium CPU login host.
[tool.cluv.clusters.trillium-gpu]
project_dir = "/scratch/sunyh/pear_cluv_control"
results_path = "/scratch/sunyh/pear_work/cluv_runs"
sbatch_args = { account = "rrg-bengioy-ad", partition = "compute_full_node", cpus-per-task = 96, mem = "0" }

[tool.cluv.clusters.trillium-gpu.env]
UV_CACHE_DIR = "/scratch/sunyh/pear_work/cache/cluv-uv"
PEAR_ROOT = "/scratch/sunyh/pear"
WORK_DIR = "/scratch/sunyh/pear_work"
ALLOW_TMPFS_LOCAL = "1"
