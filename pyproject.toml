[project]
name = "pear-cluv"
version = "0.1.0"
description = "Mila control project for the existing DRAC PEAR deployments"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.cluv]
job_script_path = "scripts/job.sh"
results_path = "$SCRATCH/logs/pear-cluv"
results_symlink = "logs"

[tool.cluv.env]
UV_OFFLINE = "1"
WANDB_MODE = "offline"

# Mila is the controller, not a PEAR training target.
[tool.cluv.clusters.mila]
project_dir = "$SCRATCH/pear-cluv"
sbatch_args = { nodes = 1, ntasks = 1, cpus-per-task = 1, mem = "1G", time = "00:01:00" }

[tool.cluv.clusters.tamia]
project_dir = "/scratch/s/sunyh/pear_cluv_control"
results_path = "/scratch/s/sunyh/pear_work/cluv_runs"
sbatch_args = { account = "aip-plbacon", partition = "gpubase_bynode_b1", nodes = 8, ntasks-per-node = 1, cpus-per-task = 48, gpus-per-node = "h100:4", mem = "450G", time = "02:00:00", job-name = "pear-stage1" }

[tool.cluv.clusters.fir]
project_dir = "/scratch/sunyh/pear_cluv_control"
results_path = "/scratch/sunyh/pear_work/cluv_runs"
sbatch_args = { account = "rrg-bengioy-ad_gpu", partition = "gpubase_bynode_b1", nodes = 8, ntasks-per-node = 1, cpus-per-task = 48, gpus-per-node = "h100:4", mem = "450G", time = "02:00:00", job-name = "pear-stage1" }

[tool.cluv.clusters.rorqual]
project_dir = "/scratch/sunyh/pear_cluv_control"
results_path = "/scratch/sunyh/pear_work/cluv_runs"
sbatch_args = { account = "rrg-bengioy-ad_gpu", partition = "gpubase_bynode_b1", nodes = 8, ntasks-per-node = 1, cpus-per-task = 64, gpus-per-node = "h100:4", mem = "450G", time = "02:00:00", job-name = "pear-stage1" }

# The alias reaches trig-login01 through the Trillium CPU login host.
[tool.cluv.clusters.trillium-gpu]
project_dir = "/scratch/sunyh/pear_cluv_control"
results_path = "/scratch/sunyh/pear_work/cluv_runs"
sbatch_args = { account = "rrg-bengioy-ad", partition = "compute_full_node", nodes = 8, ntasks-per-node = 1, cpus-per-task = 96, gpus-per-node = "h100:4", mem = "0", time = "02:00:00", job-name = "pear-stage1" }
